name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install package with dev dependencies
        run: uv pip install --system -e ".[dev,torchcodec]"

      - name: Run tests with coverage
        run: pytest test/ -v --cov=ww_trainer --cov-report=term-missing

      - name: Verify CLI entry point
        run: ww_trainer-train --help

      - name: Verify imports
        run: python -c "import ww_trainer; print(ww_trainer.__version__)"
