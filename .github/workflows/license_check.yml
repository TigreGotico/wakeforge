name: License Check

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  license_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/license-check.yml@dev
    secrets: inherit
    with:
      # pilosus matches each exclude against the resolved "name==version" string,
      # so every entry anchors the name and allows a version suffix.
      # soxr (LGPL-2.1) is a transitive dep of librosa, dynamically linked.
      # nvidia-* and cuda-toolkit are the proprietary CUDA runtime wheels that
      # torch's Linux wheel pulls in; they are loaded at runtime on GPU hosts
      # and are not part of what wakeforge ships.
      exclude_packages: '(?i:^soxr([=<>!~ @;].*)?$)|(?i:^(nvidia[-_].*|cuda[-_]toolkit)([=<>!~ @;].*)?$)'
