name: Notebook Smoke Test

on:
  push:
    branches: [main, master, dev]
    paths:
      - "notebooks/**"
      - "ww_trainer/**"
      - ".github/workflows/notebook-smoke.yml"
  pull_request:
    branches: [main, master, dev]
    paths:
      - "notebooks/**"
      - "ww_trainer/**"
      - ".github/workflows/notebook-smoke.yml"

jobs:
  # Cheap coverage for ALL notebooks: validate each is well-formed and that
  # every code cell compiles (catches syntax errors / obvious breakage without
  # downloading the multi-GB datasets the heavier notebooks need to execute).
  compile-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile every notebook's code cells
        run: |
          python - <<'PY'
          import json, glob, sys

          def py_lines(src):
              """Drop IPython magics / shell escapes (incl. backslash-continued)."""
              out, skip_cont = [], False
              for line in src.splitlines():
                  if skip_cont:
                      skip_cont = line.rstrip().endswith("\\")
                      continue
                  if line.lstrip().startswith(("!", "%")):
                      skip_cont = line.rstrip().endswith("\\")
                      continue
                  out.append(line)
              return "\n".join(out)

          failures, n_cells = [], 0
          nbs = sorted(glob.glob("notebooks/**/*.ipynb", recursive=True))
          for nb in nbs:
              doc = json.load(open(nb))
              for i, c in enumerate(doc.get("cells", [])):
                  if c.get("cell_type") != "code":
                      continue
                  src = "".join(c.get("source", []))
                  # Whole-cell magics (e.g. %%bash, %%capture) → not Python.
                  if src.lstrip().startswith("%%"):
                      continue
                  n_cells += 1
                  try:
                      compile(py_lines(src), f"{nb}[cell {i}]", "exec")
                  except SyntaxError as exc:
                      failures.append(f"{nb}[cell {i}]: {exc}")
          print(f"Checked {len(nbs)} notebooks, {n_cells} code cells")
          if failures:
              print("\n".join(failures)); sys.exit(1)
          PY

  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # torchcodec loads libtorchcodec against the FFmpeg shared libraries on
      # the box. ubuntu-24.04 has none, so every major from 4 to 9 fails to
      # load and datasets cannot read an Audio column. The apt package gives
      # FFmpeg 6 (libavutil.so.58), which torchcodec supports.
      - name: Install FFmpeg (torchcodec runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Install uv
        run: pip install uv

      - name: Install package + notebook deps
        run: uv pip install --system -e ".[notebooks]"

      # An import alone does not load libtorchcodec: the core libraries load on
      # the first decode. This step decodes a generated tone, so a missing
      # FFmpeg fails here with a clear message instead of inside the notebook.
      - name: Check the audio decoder loads
        run: |
          python - <<'PY'
          import numpy as np, soundfile as sf
          from torchcodec.decoders import AudioDecoder
          sr = 16000
          t = np.arange(sr // 10, dtype=np.float32) / sr
          sf.write("/tmp/tone.wav", (0.5 * np.sin(2 * np.pi * 440 * t)).astype(np.float32), sr)
          s = AudioDecoder("/tmp/tone.wav").get_all_samples()
          print("decoded", s.data.shape, "at", int(s.sample_rate), "Hz")
          PY

      - name: Execute genetic_search notebook (minimal settings)
        env:
          WAKE_WORD: "hey test"
          OUTPUT_DIR: "/tmp/ww_smoke"
          N_POSITIVE: "20"
          ADVERSARIAL: "false"
          DOWNLOAD_AUGMENT: "false"
          POPULATION: "3"
          GENERATIONS: "2"
          EPOCHS_PER_TRIAL: "1"
          TIERS_TO_TRAIN: "micro"
          FINAL_EPOCHS: "2"
          EXPORT_ONNX: "false"
          DEVICE: "cpu"
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute notebooks/genetic_search.ipynb \
            --ExecutePreprocessor.timeout=1800 \
            --output /tmp/executed.ipynb

      # The notebook's own dataset counts are printed inside a cell, and
      # nbconvert reports only the failing cell, so a dataset-shaped failure
      # arrives as an opaque torch error with no counts anywhere. Read the
      # CSVs the run left behind instead.
      - name: Dataset label counts (on failure)
        if: failure()
        run: |
          for csv in /tmp/ww_smoke/dataset_split/*.csv /tmp/ww_smoke/*.csv; do
            [ -f "$csv" ] || continue
            echo "== $csv"
            python3 - "$csv" <<'PY'
          import collections, csv as c, sys
          rows = list(c.reader(open(sys.argv[1])))
          print(f"   {len(rows)} rows")
          print("  ", collections.Counter(r[-1] for r in rows if r).most_common())
          PY
          done
          echo "== wav counts"
          find /tmp/ww_smoke -name '*.wav' -printf '%h\n' 2>/dev/null | sort | uniq -c | head -20

      - name: Verify key outputs exist
        run: |
          test -f /tmp/ww_smoke/evolution.png
          test -f /tmp/ww_smoke/tier_comparison.png
          ls /tmp/ww_smoke/model_micro/

      - name: Upload executed notebook on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: /tmp/executed.ipynb
