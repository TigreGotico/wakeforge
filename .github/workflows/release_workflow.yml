name: Release Alpha and Propose Stable

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  publish_alpha:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    uses: OpenVoiceOS/gh-automations/.github/workflows/publish-alpha.yml@dev
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
    with:
      branch: 'dev'
      version_file: 'ww_trainer/version.py'
      update_changelog: true
      publish_prerelease: true
      # Proposing a stable release opens a pull request against master, and
      # this repository has no master branch. Turn this on together with
      # creating one, or every merge into dev fails here and leaves an
      # orphan release branch behind.
      propose_release: false
      changelog_max_issues: 50
      publish_pypi: true
      notify_matrix: true
