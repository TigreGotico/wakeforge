[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ww_trainer"
dynamic = ["version"]
description = "Full training and research suite for wake words — MFCC to HuBERT, all exported to ONNX"
license = {text = "Apache-2.0"}
authors = [{name = "JarbasAi", email = "jarbasai@mailfence.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchaudio",
    "torchcodec",
    "onnx",
    "onnxruntime",
    "numpy",
    "soundfile",
    "click",
    "tqdm",
    "scikit-learn",
    "matplotlib",
    "librosa",
]

[project.optional-dependencies]

# ── Development & testing ──────────────────────────────────────────────────
dev = [
    "pytest",
    "pytest-cov",
]

# ── Experiment tracking ────────────────────────────────────────────────────
mlflow = [
    "mlflow",
]

# ── Hyperparameter search ──────────────────────────────────────────────────
sweep = [
    "optuna",
]

# ── Feature extractors ─────────────────────────────────────────────────────
# HuBERT / Wav2Vec2 / Wav2Vec2-BERT extractors
transformers = [
    "transformers",
]

# Markov / HMM extractor training (Baum-Welch EM)
markov = [
    "markovonnx",
]

# ── Voice conversion backends ──────────────────────────────────────────────
# CPU ONNX backend — recommended default
vc-onnx = [
    "chatterbox-onnx",
]

# GPU PyTorch backend — requires CUDA
vc-torch = [
    "chatterbox-tts",
]

# LinaCodec audio-to-audio VC backend (48 kHz, CPU or GPU)
vc-linacodec = [
    "vocos",
    "huggingface-hub",
    "jsonargparse",
    "safetensors",
    # flash-attn is optional within linacodec; omit here as it requires
    # a CUDA build environment — install manually if desired
]

# All VC backends (convenience)
vc = [
    "chatterbox-onnx",
    "chatterbox-tts",
    "vocos",
    "huggingface-hub",
    "jsonargparse",
    "safetensors",
]

# ── Dataset generation ─────────────────────────────────────────────────────
datagen = [
    "datasets",
    "ovos-plugin-manager",
    "ovos-tts-plugin-edge-tts",    # default TTS; alternatives (piper, google-tx) auto-discovered via OPM
    "ovos-vad-plugin-silero",      # default VAD
]

# ── Live microphone testing ────────────────────────────────────────────────
mic = [
    "sounddevice",
]

# ── Visualisation (UMAP embedding plots) ──────────────────────────────────
viz = [
    "umap-learn",
]

# ── Notebooks ─────────────────────────────────────────────────────────────
notebooks = [
    "jupyter",
    "nbconvert",
    "ipykernel",
    "datasets",
    "ovos-plugin-manager",
    "ovos-tts-plugin-edge-tts",
    "ovos-vad-plugin-silero",
]

[project.scripts]
ww_trainer-train = "ww_trainer.cli:train"
ww_trainer-benchmark = "ww_trainer.benchmark:main"
ww_trainer-datagen = "ww_trainer.datagen:cli_main"
ww_trainer-quickstart = "ww_trainer.quickstart:cli_main"

[project.urls]
Homepage = "https://github.com/TigreGotico/ww_trainer"

[tool.setuptools.dynamic]
version = {attr = "ww_trainer.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ww_trainer*"]
